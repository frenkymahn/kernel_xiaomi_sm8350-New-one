name: Build Next-Gen Kernel (Vili)

on:
  push:
    branches: [ "15" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zip unzip wget cpio

      - name: Setup AOSP Clang 20 (r547379) & AnyKernel3
        run: |
          mkdir -p clang
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang_repo
          cd clang_repo
          git sparse-checkout set clang-r547379
          mv clang-r547379/* ../clang/
          cd ..
          rm -rf clang_repo
          chmod +x clang/bin/*
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Build Kernel (5.4.302-NEXTGEN)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="NextGen"

          make O=out ARCH=arm64 vendor/lahaina-perf_defconfig vendor/xiaomi/vili.config

          # Enforce latest KernelSU + SUSFS options and disable OnePlus-only CONFIG_OPLUS
          ./scripts/config --file out/.config \
            -d OPLUS \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_SU

          make O=out ARCH=arm64 olddefconfig

          # Verify KSU_SUSFS and OPLUS in final .config
          grep -E "CONFIG_KSU_SUSFS=|CONFIG_OPLUS" out/.config || true

          ./scripts/config --file out/.config -e MODULE_FORCE_LOAD -e MODULES -e MODULE_UNLOAD -e MODULE_FORCE_UNLOAD -d MODVERSIONS
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package AnyKernel3 Flashable ZIP (RED-style Vili Android 16/17 Setup)
        run: bash package_ak3.sh

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-5.4.302-KSU-SUSFS-Vili
          path: NextGen-5.4.302-KSU-SUSFS-Vili.zip
