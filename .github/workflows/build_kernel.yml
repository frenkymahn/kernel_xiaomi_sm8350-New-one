name: Build Next-Gen Kernel (Vili)

on:
  push:
    branches: [ "15" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zip unzip wget cpio

      - name: Setup AOSP Clang 14 (r450784d) & AnyKernel3
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz -O clang.tar.gz && tar -xzf clang.tar.gz -C clang && rm -f clang.tar.gz
          chmod +x clang/bin/*
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Build Kernel (5.4.302-NEXTGEN)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="NextGen"

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 vendor/lahaina-perf_defconfig vendor/xiaomi/vili.config

          # Enforce Xiaomi Vili board configs + KernelSU + SUSFS + Boot fixes
          ./scripts/config --file out/.config \
            -d OPLUS \
            -e MACH_XIAOMI \
            -e MACH_XIAOMI_SM8350 \
            -e MACH_XIAOMI_VILI \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_SU \
            -e MODULE_FORCE_LOAD \
            -e MODULES \
            -e MODULE_UNLOAD \
            -d MODVERSIONS \
            -d RANDOMIZE_BASE \
            -d RELOCATABLE \
            -e LTO_CLANG \
            -d LTO_NONE \
            -e BUILD_ARM64_UNCOMPRESSED_KERNEL \
            -d BUILD_ARM64_KERNEL_COMPRESSION_GZIP

          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          # Verify Vili + KSU_SUSFS in final .config
          grep -E "CONFIG_MACH_XIAOMI|CONFIG_KSU_SUSFS=|CONFIG_RANDOMIZE_BASE|CONFIG_LTO_CLANG" out/.config || true

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Package Flashable Zip
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > AnyKernel3/dtb
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/ || true
          cd AnyKernel3
          zip -r9 ../NextGen-5.4.302-KSU-SUSFS-Vili.zip * -x .git README.md *placeholder

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-5.4.302-KSU-SUSFS-Vili
          path: NextGen-5.4.302-KSU-SUSFS-Vili.zip
