name: Build Next-Gen Kernel (Vili)

on:
  push:
    branches: [ "15" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zip unzip wget cpio

      - name: Setup AOSP Clang 20 (r547379) & AnyKernel3
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Build Kernel (5.4.302-NEXTGEN)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="NextGen"

          make O=out ARCH=arm64 vendor/lahaina-perf_defconfig vendor/xiaomi/vili.config
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Package AnyKernel3 Flashable ZIP
        run: |
          cp out/arch/arm64/boot/Image AnyKernel3/
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true
          cat out/arch/arm64/boot/dts/vendor/qcom/*.dtb > AnyKernel3/dtb 2>/dev/null || true
          cd AnyKernel3
          rm -rf .git
          zip -r9 ../NextGen-5.4.302-KSU-SUSFS-Vili.zip * -x .git README.md *placeholder

      - name: Upload Kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NextGen-5.4.302-KSU-SUSFS-Vili
          path: NextGen-5.4.302-KSU-SUSFS-Vili.zip
