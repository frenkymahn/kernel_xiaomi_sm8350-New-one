name: Build Xiaomi 11T Pro Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev libelf-dev python3 zip libncurses5-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lld llvm

      - name: Download Official AOSP Clang
        run: |
          mkdir -p clang
          cd clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release .
          cd ..

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/clang/clang-r416183b/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # 1. Base defconfig
          make O=out ARCH=arm64 CC=clang LD=ld.lld vendor/lahaina-perf_defconfig

          # 2. Merge vili.config safely
          if [ -f arch/arm64/configs/vendor/xiaomi/vili.config ]; then
            echo "Merging vili.config..."
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/xiaomi/vili.config
          fi

          # 3. Android 15/16/17 Mandatory eBPF, Cgroups & Binder Protection (No Timeout Crash)
          ./scripts/config --file out/.config \
            -e CONFIG_BPF \
            -e CONFIG_BPF_SYSCALL \
            -e CONFIG_NET_CLS_ACT \
            -e CONFIG_NET_CLS_BPF \
            -e CONFIG_NET_ACT_BPF \
            -e CONFIG_BPF_JIT \
            -e CONFIG_CGROUP_BPF \
            -e CONFIG_PSI \
            -e CONFIG_MEMCG \
            -e CONFIG_CGROUPS \
            -e CONFIG_NAMESPACES \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_EROFS_FS \
            -e CONFIG_EROFS_FS_ZIP \
            -d CONFIG_ANDROID_BINDER_IPC_SELFTEST

          # 4. Finalize config
          make O=out ARCH=arm64 CC=clang LD=ld.lld olddefconfig

          # 5. Compile Image, DTBs, DTBO and Kernel Modules
          make -j$(nproc --all) ARCH=arm64 CC=clang LD=ld.lld KCFLAGS="-w" Image dtbs dtbo.img modules O=out
          make O=out ARCH=arm64 CC=clang LD=ld.lld INSTALL_MOD_PATH=../modules_out modules_install

      - name: Fetch Official HyperOS Firmware (vili)
        run: |
          mkdir -p firmware_extract
          cd firmware_extract
          # Fetching official tested HyperOS firmware for Xiaomi 11T Pro (vili)
          curl -LO "https://bigota.d.miui.com/OS1.0.4.0.UKDMIXM/miui_VILIGlobal_OS1.0.4.0.UKDMIXM_5e7bb9e2d3_14.0.zip" || true
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -q *.zip "firmware-update/*" || true
          fi
          cd ..

      - name: Package Kernel with AnyKernel3
        run: |
          # 1. Clone AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # 2. Copy compiled Image, DTBO and DTB
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          cat out/arch/arm64/boot/dts/vendor/qcom/lahaina*.dtb > AnyKernel3/dtb

          # 3. Copy compiled hardware driver modules (.ko)
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find modules_out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \;

          # 4. Include Firmware Partitions if extracted
          if [ -d "firmware_extract/firmware-update" ]; then
            mkdir -p AnyKernel3/firmware-update
            cp -r firmware_extract/firmware-update/* AnyKernel3/firmware-update/
          fi

          # 5. Production Tested AnyKernel Script
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ## Xiaomi 11T Pro (vili) - Android 15 to 17

          properties() { '
          kernel.string=NextGen Kernel + Official Firmware for Xiaomi 11T Pro (vili)
          do.devicecheck=1
          do.modules=1
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=Xiaomi 11T Pro
          device.name2=milahaina
          device.name3=vili
          device.name4=vili_in
          supported.versions=11.0-17.0
          '; }

          # --- 1. Flash Kernel Image to boot partition ---
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh && passthrough;

          dump_boot;
          write_boot;

          # --- 2. Flash DTBO Partition safely ---
          flash_dtbo;

          # --- 3. Flash Full DTB to vendor_boot directly ---
          BLOCK=vendor_boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          reset_ak;
          split_boot;
          flash_boot;

          # --- 4. Flash Official Firmware Partitions safely ---
          if [ -d "$home/firmware-update" ]; then
            ui_print "Flashing official firmware partitions...";
            for img in "$home/firmware-update"/*.img; do
              part=$(basename "$img" .img);
              if [ -e "/dev/block/by-name/${part}_a" ]; then
                flash_generic "$img" "/dev/block/by-name/${part}_a";
              elif [ -e "/dev/block/by-name/${part}" ]; then
                flash_generic "$img" "/dev/block/by-name/${part}";
              fi;
            done;
          fi;
          EOF

          # 6. Create flashable zip package
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-NextGen-Kernel.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-Kernel-Zip
          path: Xiaomi-11T-Pro-NextGen-Kernel.zip
