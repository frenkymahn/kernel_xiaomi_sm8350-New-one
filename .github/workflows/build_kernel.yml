name: Build Vili Next-Gen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev git zip curl wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Official AOSP Clang
        run: |
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android14-release clang_host
          CLANG_DIR=$(ls -d clang_host/clang-r* | head -n 1)
          mv "$CLANG_DIR" clang
          rm -rf clang_host

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 url?id=1osm0sis/AnyKernel3.git AnyKernel3

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # 1. Load Lahaina base defconfig
          make O=out ARCH=arm64 CC=clang vendor/lahaina-perf_defconfig

          # 2. Merge Xiaomi vili specific configuration
          VILI_CONFIG=$(find arch/arm64/configs/vendor/xiaomi/ -name "*vili*" | head -n 1)
          if [ -n "$VILI_CONFIG" ]; then
            echo "Merging config: $VILI_CONFIG"
            scripts/kconfig/merge_config.sh -m -O out out/.config "$VILI_CONFIG"
          fi

          # 3. Configure LocalVersion, OverlayFS, and HyperOS flags
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-Next-Gen" \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_TMPFS_XATTR \
            -e CONFIG_EROFS_FS \
            -e CONFIG_EROFS_FS_ZIP \
            -e CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE

          # 4. Finalize config
          make O=out ARCH=arm64 CC=clang olddefconfig

          # 5. Compile raw Image, DTBs, DTBO, and Modules
          make -j$(nproc --all) ARCH=arm64 CC=clang Image dtbs dtbo.img modules O=out

          # 6. Install kernel modules
          make O=out ARCH=arm64 CC=clang INSTALL_MOD_PATH=../modules_out modules_install

      - name: Prepare AnyKernel3 Package
        run: |
          # 1. Copy Kernel Image
          cp out/arch/arm64/boot/Image AnyKernel3/Image

          # 2. Concatenate and copy DTB
          if [ -d out/arch/arm64/boot/dts/vendor/qcom ]; then
            cat out/arch/arm64/boot/dts/vendor/qcom/*.dtb > AnyKernel3/dtb 2>/dev/null || true
          elif [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb AnyKernel3/dtb
          fi

          # 3. Copy DTBO image
          find out/arch/arm64/boot/ -name "dtbo.img" -exec cp {} AnyKernel3/dtbo.img \;

          # 4. Prepare modules directory structure
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find ../modules_out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          touch AnyKernel3/modules/placeholder

          # 5. Configure AnyKernel3 script for Xiaomi 11T Pro (vili)
          sed -i 's/device.name1=.*/device.name1=vili/g' AnyKernel3/anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' AnyKernel3/anykernel.sh

          # 6. Create full flashable zip
          cd AnyKernel3
          zip -r9 ../Next-Gen-HyperOS-Vili-Kernel.zip META-INF modules tools anykernel.sh dtb dtbo.img Image LICENSE -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-HyperOS-Vili-Kernel
          path: Next-Gen-HyperOS-Vili-Kernel.zip
