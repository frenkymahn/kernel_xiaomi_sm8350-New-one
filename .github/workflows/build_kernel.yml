name: Build Vili Next-Gen Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev git zip curl wget

      - name: Download AOSP Clang
        run: |
          mkdir -p clang
          cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747c.tar.gz
          tar -xf clang-r487747c.tar.gz
          cd ..

      - name: Clone D8G Kernel Source
        run: |
          git clone --depth=1 https://github.com/diphons/kernel_xiaomi_sm8350 -b miui-base kernel_src

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 -b master AnyKernel3

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          cd kernel_src
          make O=out ARCH=arm64 vili_user_defconfig

          # Configure LocalVersion and Filesystem Flags
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-Next-Gen" \
            -e CONFIG_OVERLAY_FS \
            -e CONFIG_TMPFS_XATTR \
            -e CONFIG_EROFS_FS \
            -e CONFIG_EROFS_FS_ZIP \
            -e CONFIG_TOUCHSCREEN_XIAOMI_TOUCHFEATURE

          # Compile uncompressed Image, DTBs, DTBO, and Kernel Modules
          make -j$(nproc --all) O=out CC=clang Image dtbs dtbo.img modules

          # Install kernel modules into temporary directory
          make O=out CC=clang INSTALL_MOD_PATH=../modules_out modules_install

      - name: Prepare AnyKernel3 Package
        run: |
          # Copy Raw Kernel Image
          cp kernel_src/out/arch/arm64/boot/Image AnyKernel3/Image

          # Concatenate and Copy DTB
          if [ -d kernel_src/out/arch/arm64/boot/dts/vendor/qcom ]; then
            cat kernel_src/out/arch/arm64/boot/dts/vendor/qcom/*.dtb > AnyKernel3/dtb 2>/dev/null || true
          elif [ -f kernel_src/out/arch/arm64/boot/dtb ]; then
            cp kernel_src/out/arch/arm64/boot/dtb AnyKernel3/dtb
          fi

          # Copy DTBO image
          find kernel_src/out/arch/arm64/boot/ -name "dtbo.img" -exec cp {} AnyKernel3/dtbo.img \;

          # Setup modules directory structure
          mkdir -p AnyKernel3/modules/vendor/lib/modules
          find modules_out/ -name "*.ko" -exec cp {} AnyKernel3/modules/vendor/lib/modules/ \; 2>/dev/null || true
          touch AnyKernel3/modules/placeholder

          # Configure AnyKernel3 script for Xiaomi 11T Pro (vili)
          sed -i 's/device.name1=.*/device.name1=vili/g' AnyKernel3/anykernel.sh
          sed -i 's/block=.*/block=\/dev\/block\/bootdevice\/by-name\/boot/g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0/is_slot_device=auto/g' AnyKernel3/anykernel.sh

          # Create flashable zip containing all required components
          cd AnyKernel3
          zip -r9 ../Next-Gen-HyperOS-Vili-Kernel.zip META-INF modules tools anykernel.sh dtb dtbo.img Image LICENSE -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Next-Gen-HyperOS-Vili-Kernel
          path: Next-Gen-HyperOS-Vili-Kernel.zip
