name: Build Xiaomi 11T Pro Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile and Package Kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential curl flex git libssl-dev libelf-dev python3 zip libncurses5-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lld llvm

      - name: Download Official AOSP Clang
        run: |
          mkdir -p clang
          cd clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android12-release .
          cd ..

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Configure and Build Kernel
        run: |
          export PATH="$(pwd)/clang/clang-r416183b/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabi-

          # 1. Base defconfig
          make O=out ARCH=arm64 CC=clang LD=ld.lld vendor/lahaina-perf_defconfig

          # 2. Merge Xiaomi vili config
          VILI_CONFIG=$(find arch/arm64/configs/vendor/xiaomi/ -name "*vili*" | head -n 1)
          if [ -n "$VILI_CONFIG" ]; then
            echo "Merging config: $VILI_CONFIG"
            scripts/kconfig/merge_config.sh -m -O out out/.config "$VILI_CONFIG"
          fi

          # 3. Finalize config
          make O=out ARCH=arm64 CC=clang LD=ld.lld olddefconfig

          # 4. Compile Image, DTBs, and DTBO
          make -j$(nproc --all) ARCH=arm64 CC=clang LD=ld.lld KCFLAGS="-w" Image dtbs dtbo.img O=out

      - name: Package Kernel with AnyKernel3
        run: |
          # 1. Clone AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          # 2. Copy artifacts to AnyKernel3 root
          cp out/arch/arm64/boot/Image AnyKernel3/Image
          cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          find out/arch/arm64/boot/dts/ -name "*.dtb" -exec cat {} + > AnyKernel3/dtb

          # 3. Generate fully tuned anykernel.sh for HyperOS 3.0/4.0
          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers
          ## Tuned for Xiaomi 11T Pro (vili) - HyperOS 3.0/4.0 (A16-A17)

          properties() { '
          kernel.string=NextGen Kernel for Xiaomi 11T Pro (vili)
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=Xiaomi 11T Pro
          device.name2=milahaina
          device.name3=vili
          device.name4=vili_in
          supported.versions=11.0-17.0
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # 1. Boot Partition Setup
          BLOCK=boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh && passthrough;

          dump_boot;

          # Avoid bootloop on Android 16/17 port ROMs by enforcing permissive cmdline
          patch_cmdline "androidboot.selinux" "androidboot.selinux=permissive";

          write_boot;

          # 2. Flash DTBO Partition (Display & Touch Panel sync)
          flash_dtbo;

          # 3. Flash DTB to Vendor Boot Partition
          BLOCK=vendor_boot;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          reset_ak;

          split_boot;
          unpack_ramdisk;
          repack_ramdisk;
          flash_boot;
          EOF

          # 4. Create flashable zip package
          cd AnyKernel3
          zip -r9 ../Xiaomi-11T-Pro-NextGen-Kernel.zip * -x .git README.md

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-Kernel-Zip
          path: Xiaomi-11T-Pro-NextGen-Kernel.zip
