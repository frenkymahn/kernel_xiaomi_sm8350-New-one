name: Build Next-Gen Kernel (Vili)

on:
  push:
    branches: [ "15" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 python-is-python3 zip unzip wget cpio

      - name: Setup AOSP Clang 20 (r547379) & AnyKernel3
        run: |
          mkdir -p clang
          git clone --depth=1 --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang_repo
          cd clang_repo
          git sparse-checkout set clang-r547379
          mv clang-r547379/* ../clang/
          cd ..
          rm -rf clang_repo
          chmod +x clang/bin/*
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Build Kernel (5.4.302-NEXTGEN)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="NextGen"

          make O=out ARCH=arm64 vendor/lahaina-perf_defconfig vendor/xiaomi/vili.config

          # Enforce latest KernelSU + SUSFS options and disable OnePlus-only CONFIG_OPLUS
          ./scripts/config --file out/.config \
            -d OPLUS \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e KSU_SUSFS_OPEN_REDIRECT \
            -e KSU_SUSFS_SUS_SU

          make O=out ARCH=arm64 olddefconfig

          # Verify KSU_SUSFS and OPLUS in final .config
          grep -E "CONFIG_KSU_SUSFS=|CONFIG_OPLUS" out/.config || true

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

    - name: Package AnyKernel3 Flashable ZIP (RED-style Vili Android 16/17 Setup)
      run: |
        cp out/arch/arm64/boot/Image AnyKernel3/
        rm -f AnyKernel3/dtbo.img

        if [ -f "custom_dtb/dtb" ]; then
          cp custom_dtb/dtb AnyKernel3/dtb
        else
          DTS="out/arch/arm64/boot/dts/vendor/qcom"
          cat "$DTS/lahaina-v2.1.dtb" "$DTS/lahaina-v2.dtb" "$DTS/lahaina.dtb" "$DTS/yupik.dtb" > AnyKernel3/dtb 2>/dev/null || \
          cat "$DTS"/*.dtb > AnyKernel3/dtb
        fi

        cat << 'EOF' > AnyKernel3/anykernel.sh
        ### AnyKernel3 Ramdisk Mod Script
        ## osm0sis @ xda-developers

        ### AnyKernel setup
        properties() { '
        kernel.string=NextGen-5.4.302-KSU-SUSFS by frenkymahn
        do.devicecheck=1
        do.modules=0
        do.systemless=1
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=vili
        device.name2=Vili
        supported.versions=14 - 17
        supported.patchlevels=
        '; }

        ### AnyKernel install
        block=/dev/block/bootdevice/by-name/boot;
        is_slot_device=1;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        . tools/ak3-core.sh;

        # boot install - replace kernel in boot partition
        dump_boot;
        write_boot;

        ## vendor_boot - flash Android 16/17 DTB + keep vendor ramdisk & stock DTBO intact
        block=/dev/block/bootdevice/by-name/vendor_boot;
        is_slot_device=1;
        ramdisk_compression=auto;
        patch_vbmeta_flag=auto;

        reset_ak;
        split_boot;
        flash_boot;
        EOF

        cd AnyKernel3
        rm -rf .git
        zip -r9 ../NextGen-5.4.302-KSU-SUSFS-Vili.zip * -x .git README.md *placeholder
